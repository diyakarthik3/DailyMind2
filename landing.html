<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyMind - Wellness Hub</title>
    <style>
        :root {
            --bg-a: #edf2ff;
            --bg-b: #dce6fe;
            --bg-c: #cddaff;
            --text-main: #17223d;
            --text-sub: #4b5d7d;
            --primary-accent: #312f89;
            --primary-accent-hover: #2a2878;
            --glass-bg: rgba(245, 248, 255, 0.56);
            --glass-border-color: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 18px 40px rgba(37, 55, 100, 0.12);
            --control-bg: rgba(244, 248, 255, 0.62);
            --control-pill: rgba(255, 255, 255, 0.74);
            --control-text: #1f2a47;
            --surface-card: rgba(255, 255, 255, 0.58);
        }

        [data-theme="dark"] {
            --bg-a: #0c1324;
            --bg-b: #15203a;
            --bg-c: #1f2f4f;
            --text-main: #f8fbff;
            --text-sub: #cbd8ee;
            --primary-accent: #7f8cff;
            --primary-accent-hover: #6a78ef;
            --glass-bg: rgba(17, 26, 47, 0.66);
            --glass-border-color: rgba(255, 255, 255, 0.14);
            --glass-shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
            --control-bg: rgba(17, 26, 47, 0.62);
            --control-pill: rgba(11, 18, 35, 0.7);
            --control-text: #f8fbff;
            --surface-card: rgba(19, 31, 56, 0.76);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 16%, rgba(255, 255, 255, 0.55), transparent 44%),
                        radial-gradient(circle at 88% 86%, rgba(255, 255, 255, 0.28), transparent 36%),
                        linear-gradient(145deg, var(--bg-a), var(--bg-b) 46%, var(--bg-c));
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 110px 32px 32px;
            transition: all 0.3s ease;
        }

        .scene {
            width: min(1180px, 100%);
        }

        .control-bar {
            position: fixed;
            top: 18px;
            right: 22px;
            z-index: 20;
            display: flex;
            gap: 7px;
            padding: 8px;
            border-radius: 18px;
            background: var(--control-bg);
            border: 1px solid var(--glass-border-color);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: var(--glass-shadow);
            width: max-content;
        }

        .control-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            border: 1px solid var(--glass-border-color);
            background: var(--control-pill);
            color: var(--control-text);
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .theme-toggle {
            width: 40px;
            height: 22px;
            border-radius: 999px;
            border: 1px solid var(--glass-border-color);
            background: rgba(255, 255, 255, 0.57);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-accent);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .theme-toggle::after {
            transform: translateX(18px);
        }

        #accent-picker {
            width: 18px;
            height: 18px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }

        .layout {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border-color);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            padding: 34px 36px;
            width: min(920px, 96vw);
            transition: all 0.3s ease;
        }

        .hero-title {
            font-family: "Avenir Next", "Manrope", "Segoe UI", sans-serif;
            font-size: clamp(60px, 5.8vw, 82px);
            line-height: 1.02;
            letter-spacing: 0.1px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .lead {
            font-family: "Avenir Next", "Manrope", "Segoe UI", sans-serif;
            font-size: 24px;
            line-height: 1.3;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0.1px;
            color: var(--text-sub);
            margin-bottom: 30px;
            max-width: 48ch;
        }

        .btn-start {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: none;
            border-radius: 13px;
            background: var(--primary-accent);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(45, 63, 102, 0.24);
            transition: all 0.3s ease;
            margin-bottom: 14px;
        }

        .btn-start:hover {
            background: var(--primary-accent-hover);
            transform: translateY(-1px);
        }

        .feature-box {
            display: grid;
            gap: 10px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 13px;
            padding: 12px 13px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .feature-item span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-accent);
            box-shadow: 0 0 0 4px rgba(61, 65, 143, 0.15);
            flex-shrink: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 13px;
            padding: 12px 14px;
        }

        .stat-card h4 {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .stat-card p {
            font-size: 39px;
            line-height: 1;
            color: var(--primary-accent);
            font-weight: 800;
        }

        .stats-note {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.45;
        }

        @media (max-width: 980px) {
            .layout {
                max-width: 640px;
            }

            .control-bar {
                top: 12px;
                right: 12px;
            }

            .scene {
                max-width: 640px;
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 18px 12px;
                align-items: start;
            }

            .glass-card {
                padding: 24px 18px;
                width: 100%;
            }

            .btn-start {
                width: 100%;
                font-size: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .lead {
                font-size: 16px;
            }

            .hero-title {
                font-size: clamp(44px, 9vw, 58px);
                letter-spacing: 0.2px;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="control-bar">
            <div class="control-pill">
                <span id="theme-label">Light</span>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
            </div>
            <div class="control-pill">
                <span>Accent</span>
                <input id="accent-picker" type="color" value="#312f89" aria-label="Pick accent color">
            </div>
        </div>

        <div class="layout">
            <div class="glass-card">
                <h1 class="hero-title">DailyMind</h1>
                <p class="lead">Better days start with better minds.</p>

                <button class="btn-start" onclick="startApp()">Get Started</button>

                <div class="feature-box">
                    <div class="feature-item"><span></span>Adaptive daily plans powered by your input</div>
                    <div class="feature-item"><span></span>Medication reminders and mood tracking</div>
                    <div class="feature-item"><span></span>AI support, trends, and caregiver visibility</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            applyStoredThemeAndAccent();

            const toggle = document.getElementById('theme-toggle');
            const picker = document.getElementById('accent-picker');

            if (toggle) {
                toggle.addEventListener('click', toggleTheme);
            }

            if (picker) {
                picker.addEventListener('input', (event) => {
                    setAccentColor(event.target.value);
                });
            }
        });

        function applyStoredThemeAndAccent() {
            const theme = localStorage.getItem('dailymind_theme') || 'light';
            const accent = localStorage.getItem('dailymind_accent') || '#312f89';
            setTheme(theme);
            setAccentColor(accent);
            const picker = document.getElementById('accent-picker');
            if (picker) {
                picker.value = accent;
            }
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('dailymind_theme', theme);
            const label = document.getElementById('theme-label');
            if (label) {
                label.textContent = theme === 'dark' ? 'Dark' : 'Light';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        function setAccentColor(color) {
            document.documentElement.style.setProperty('--primary-accent', color);
            document.documentElement.style.setProperty('--primary-accent-hover', color);
            localStorage.setItem('dailymind_accent', color);
        }

        function startApp() {
            fetch('/api/navigate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ step: 'Onboarding' })
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.success) {
                    window.location.href = '/';
                }
            })
            .catch(err => console.error('Navigation error:', err));
        }
    </script>
</body>
</html>
